{% extends "base.html" %}
{% block title %}Place an Order{% endblock %}
{% block content %}
    <h1>Place an Order</h1>
    <form method="POST" action="{{ url_for('create_order') }}">

        <label>Your Name</label>
        <input type="text" name="customer_name" required>

        <label>Phone or Email</label>
        <input type="text" name="contact_info" required>

        <label>Event Date</label>
        <input type="date" name="event_date" required>

        <label>Fulfillment Type</label>
        <select name="fulfillment_type" id="fulfillment_type" onchange="toggleFields()" required>
            <option value="delivery">Delivery (we drop off & pick up)</option>
            <option value="pickup">Self Pickup</option>
        </select>

        <div id="delivery_fields">
            <label>Drop-off Time</label>
            <input type="datetime-local" name="dropoff_time">
            <label>Pickup-by Time (when we come get it)</label>
            <input type="datetime-local" name="pickup_by_time">
        </div>

        <div id="pickup_fields" style="display:none;">
            <label>What time will you arrive to pick up?</label>
            <input type="datetime-local" name="pickup_time">
        </div>

        <h3>Items</h3>
        <table>
            <tr><th>Item</th><th>Price/Day</th><th>Quantity</th></tr>
            {% for item in items %}
            <tr>
                <td>{{ item.name }}</td>
                <td>${{ "%.2f"|format(item.price_per_day) }}</td>
                <td><input type="number" name="qty_{{ item.id }}" min="0" max="{{ item.quantity_available }}" value="0"></td>
            </tr>
            {% endfor %}
        </table>

        <button type="submit">Submit Order</button>
    </form>

    <script>
        function toggleFields() {
            const type = document.getElementById('fulfillment_type').value;
            document.getElementById('delivery_fields').style.display = (type === 'delivery') ? 'block' : 'none';
            document.getElementById('pickup_fields').style.display = (type === 'pickup') ? 'block' : 'none';
        }
    </script>
{% endblock %}
