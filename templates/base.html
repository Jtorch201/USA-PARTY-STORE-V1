<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}USA Party Store{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; color: #222; }
        h1 { color: #b3271b; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
        input, select { padding: 6px; margin: 4px 0 12px 0; width: 100%; box-sizing: border-box; }
        label { font-weight: bold; }
        button { background: #b3271b; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; }
        .nav { margin-bottom: 20px; }
        .nav a { margin-right: 15px; color: #b3271b; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="{{ url_for('list_items') }}">Browse Items</a>
        <a href="{{ url_for('new_order_form') }}">Place an Order</a>
    </div>
    {% block content %}{% endblock %}
</body>
</html>
